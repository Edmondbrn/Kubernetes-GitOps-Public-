apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: mudis
  namespace: argocd
spec:
  description: Holograph-web / MUDIS application
  sourceRepos:
    - https://github.com/Edmondbrn/Kubernetes-GitOps-Public-.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: mudis-dev
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: storage.k8s.io
      kind: StorageClass
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
