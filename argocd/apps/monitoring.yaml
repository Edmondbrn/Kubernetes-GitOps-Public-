apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3" # before the app and the monitoring add-ons
spec:
  project: monitoring
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 92.14.1
    helm:
      releaseName: kube-prometheus-stack
      values: |
        crds:
          enabled: true

        # No notification routing for now: alerts stay visible in Prometheus/Grafana.
        alertmanager:
          enabled: false

        grafana:
          admin:
            existingSecret: grafana-admin
          persistence:
            enabled: true
            storageClassName: local-path
            size: 1Gi
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 768Mi
          sidecar:
            datasources:
              # Alertmanager is disabled: hide the dangling datasource
              alertmanager:
                enabled: false
          # Grafana provisioning never removes a datasource dropped from its
          # config file, so delete the one created by earlier revisions.
          deleteDatasources:
            - name: Alertmanager
              orgId: 1
          ingress:
            enabled: true
            ingressClassName: traefik
            path: /
            hosts:
              - grafana.localhost
          serviceMonitor:
            enabled: true

        prometheus:
          prometheusSpec:
            retention: 3d
            retentionSize: 4GB
            # pick up ServiceMonitors / Probes / rules created outside this Helm release
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            probeSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            resources:
              requests:
                cpu: 100m
                memory: 384Mi
              limits:
                memory: 1Gi
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: local-path
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 5Gi

        prometheusOperator:
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi

        kube-state-metrics:
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 192Mi

        prometheus-node-exporter:
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 96Mi

        # k3s runs these control-plane components embedded: scraping them only
        # produces permanently-down targets and false alerts.
        # CoreDNS monitoring is disabled because its chart-managed Service
        # lives in kube-system and the AppProject is scoped to monitoring.
        coreDns:
          enabled: false
        kubeDns:
          enabled: false
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeEtcd:
          enabled: false
        kubeProxy:
          enabled: false
        defaultRules:
          rules:
            kubeControllerManager: false
            kubeSchedulerAlerting: false
            kubeSchedulerRecording: false
            kubeProxy: false
            etcd: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
