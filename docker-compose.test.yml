services:
  postgres_test:
    image: postgres:18-alpine
    container_name: test_postgres_db
    volumes:
      - ghcr.io/<github-user>/holograph-postgres18-test-db:/var/lib/postgresql
    environment:
      POSTGRES_DB: test_postgres_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: ["postgres", "-c", "log_statement=all", "-c", "log_destination=stderr"]



  virtuoso_test:
    image: docker.io/openlink/virtuoso-opensource-7:7.2.16
    container_name: test_virtuoso_db
    environment:
      - DAV_PASSWORD=${TEST_DAV_PASSWORD:-testPwd}
      - DBA_PASSWORD=${TEST_DBA_PASSWORD:-testPwd}

      # Also allow /data dir
      - VIRT_PARAMETERS_DIRSALLOWED=., ../vad, /usr/share/proj, /data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8890/sparql"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    ports:
      - "8891:8890"
    restart: unless-stopped
    volumes:
      - ./virtuoso/test-data:/data:ro
      - ./virtuoso/load-test.sql:/initdb.d/load.sql:ro
      # Contains the database files
      - holograph-virtuoso-test-db:/database
    labels:
      - com.centurylinklabs.watchtower.enable=true

  redis:
    container_name: test_redis
    image: redis:8-alpine
    ports:
      - "6379:6379"

volumes:
  ghcr.io/<github-user>/holograph-postgres18-test-db:
  holograph-virtuoso-test-db: