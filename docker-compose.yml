# =====================================================================
# DEVELOPMENT docker-compose file
# Run with: docker compose up -d
# =====================================================================

secrets:
  db_user_password:
    file: ./secrets/db_user_password.txt
  db_password_anon:
    file: ./secrets/db_password_anon.txt
  db_password_cron:
    file: ./secrets/db_password_cron.txt
  dba_password:
    file: ./secrets/dba_password.txt
  dav_password:
    file: ./secrets/dav_password.txt
  jwt_secret_key:
    file: ./secrets/jwt_secret_key.txt
  db_password_admin:
    file: ./secrets/db_password_admin.txt
  db_app_admin_password:
    file: ./secrets/db_app_admin_password.txt
  seed_admin_password:
    file: ./secrets/seed_admin_password.txt

x-restart-policy: &restart-policy
  restart: unless-stopped

services:

  # ==========================================================
  # FastAPI backend (Dev Mode)
  # ==========================================================
  fastapi_backend:
    <<: *restart-policy
    user: "1000:1000"
    build: ./fastapi_backend
    container_name: fastapi_server
    develop:
      watch:
        - action: sync+restart
          path: ./fastapi_backend/src
          target: /app/src
        - action: rebuild
          path: ./fastapi_backend/uv.lock
    ports:
      - "8000:8000"
    volumes:
      - celery-data:/celery/write
      - user-results:/user-results/read:ro
      - app-logs:/var/log/app
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - SERVICE_NAME=api
    secrets:
      - source: db_user_password
        target: DB_USER_PASSWORD
      - source: db_password_admin
        target: DB_PASSWORD_ADMIN
      - source: db_password_anon
        target: DB_PASSWORD_ANON
      - source: db_password_cron
        target: DB_PASSWORD_CRON
      - source: dba_password
        target: DBA_PASSWORD
      - source: jwt_secret_key
        target: JWT_SECRET_KEY
      - source: seed_admin_password
        target: SEED_ADMIN_PASSWORD
      - source: db_app_admin_password
        target: DB_APP_ADMIN_PASSWORD
    depends_on:
      virtuoso:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else sys.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  # ==========================================================
  # Celery worker (Dev Mode)
  # ==========================================================
  celery_worker:
    <<: *restart-policy
    user: "1000:1000"
    build: ./fastapi_backend
    entrypoint: []
    command: celery -A src.celery_app worker -Q long_tasks --concurrency=3 --prefetch-multiplier=1 --loglevel=info
    develop:
      watch:
        - action: sync+restart
          path: ./fastapi_backend/src
          target: /app/src/
    volumes:
      - celery-data:/celery/read:ro
      - user-results:/user-results/write
      - app-logs:/var/log/app
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - SERVICE_NAME=celery
    secrets:
      - source: db_user_password
        target: DB_USER_PASSWORD
      - source: db_password_admin
        target: DB_PASSWORD_ADMIN
      - source: db_password_anon
        target: DB_PASSWORD_ANON
      - source: db_password_cron
        target: DB_PASSWORD_CRON
      - source: dba_password
        target: DBA_PASSWORD
      - source: jwt_secret_key
        target: JWT_SECRET_KEY
      - source: seed_admin_password
        target: SEED_ADMIN_PASSWORD
      - source: db_app_admin_password
        target: DB_APP_ADMIN_PASSWORD
    depends_on:
      virtuoso:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A src.celery_app inspect ping -d celery@$$HOSTNAME | grep -q OK || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ==========================================================
  # Next.js frontend (Dev Mode)
  # ==========================================================
  next_frontend:
    <<: *restart-policy
    build: 
      context: ./next_frontend
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_BASE_URL}
    container_name: nextJs_server
    develop:
      watch:
        - action: sync
          path: ./next_frontend/src
          target: app/src
        - action: rebuild
          path: ./next_frontend/pnpm-lock.yaml
    ports:
      - "3000:3000"
    environment:
      - NEXT_TELEMETRY_DEBUG=${NEXT_TELEMETRY_DEBUG:-1}
      - REFRESH_TOKEN_NAME=${REFRESH_TOKEN_NAME}
      - ACCESS_TOKEN_NAME=${ACCESS_TOKEN_NAME}
      - NEXT_FAST_API_URL=${NEXT_FAST_API_URL}
    depends_on:
      fastapi_backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  # ==========================================================
  # Virtuoso (Dev Mode)
  # ==========================================================
  virtuoso:
    <<: *restart-policy
    image: docker.io/openlink/virtuoso-opensource-7:7.2.16
    env_file:
      - .env
    environment:
      - VIRT_PARAMETERS_DIRSALLOWED=., ../vad, /usr/share/proj, /data
      - VIRT_PARAMETERS_NUMBEROFBUFFERS=${VIRT_PARAMETERS_NUMBEROFBUFFERS:-10000}
      - VIRT_PARAMETERS_MAXDIRTYBUFFERS=${VIRT_PARAMETERS_MAXDIRTYBUFFERS:-6000}
      - VIRT_PARAMETERS_MAXTHREADS=${VIRT_PARAMETERS_MAXTHREADS:-100}
    secrets:
      - dba_password
      - dav_password
    entrypoint:
      - /bin/sh
      - -c
      - >
        export DBA_PASSWORD="$$(cat /run/secrets/dba_password)";
        export DAV_PASSWORD="$$(cat /run/secrets/dav_password)";
        exec /virtuoso-entrypoint.sh "$$@"
      - --
    ports:
      - ${VIRT_HTTP_PORT:-8890}:8890
    volumes:
      - holograph-virtuoso-db:/database
      - ./virtuoso/data:/data:ro
      - ./virtuoso/load.sql:/initdb.d/load.sql:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8890/sparql"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 180s
    labels:
      - com.centurylinklabs.watchtower.enable=true

  # ==========================================================
  # Postgres (Dev Mode)
  # ==========================================================
  postgres:
    <<: *restart-policy
    image: postgres:18-alpine
    container_name: ${DB_NAME}
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_ADMIN_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password_admin
    secrets:
      - db_password_admin
    volumes:
      - ghcr.io/<github-user>/holograph-postgres-db:/var/lib/postgresql
    ports:
      - "5000:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_ADMIN_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================================
  # Redis (Dev Mode)
  # ==========================================================
  redis:
    <<: *restart-policy
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  ghcr.io/<github-user>/holograph-postgres-db:
  holograph-virtuoso-db:
  celery-data:
  user-results:
  app-logs: