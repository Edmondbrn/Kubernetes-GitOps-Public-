apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mudis-dev

resources:
  - ../../../base/platform
  - namespace.yaml

patches:
  - target:
      kind: Namespace
    # add argocd annotationb to Namespace creation, must be the very first element
    patch: |- 
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "-10"
