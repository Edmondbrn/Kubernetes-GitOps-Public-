# allow NFS call from nodes
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-nfs-from-nodes
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nfs-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 10.42.0.0/16
      ports:
        - protocol: TCP
          port: 2049
