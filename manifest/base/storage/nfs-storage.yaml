apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-csi
  annotations:
     storageclass.kubernetes.io/is-default-class: "false"  # default is local host
provisioner: nfs.csi.k8s.io
parameters:
  server: nfs-server.mudis-dev.svc.cluster.local
  share: "/"
  uid: "1000" # subdirectory owner, matches runAsUser in workloads
  gid: "1000" # subdirectory group, matches runAsGroup in workloads
  mountPermissions: "0775" # driver chmods the mounted folder
reclaimPolicy: Delete # delete the PV when the PVC is deleted, other is Retain
volumeBindingMode: Immediate # instant provision
allowVolumeExpansion: true # do not block volume expansion
mountOptions:
  # Soft mounts for the disposable k3d/dev cluster: if the NFS server or export
  # disappears, mounts fail fast instead of blocking pod termination forever
  # (a hard mount is the safe choice for production with reliable storage).
  - soft
  - timeo=100 # 10 seconds per retransmission
  - retrans=3
  - nfsvers=4.1 # better stability
  - noatime # avoid updating time access
  - rsize=1048576  # write block size (1MB)
  - wsize=1048576 # write block size (1MB)