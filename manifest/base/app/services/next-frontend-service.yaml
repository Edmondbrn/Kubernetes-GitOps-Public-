apiVersion: v1
kind: Service
metadata:
  labels:
    io.kompose.service: next-frontend
  name: next-frontend
spec:
  type: ClusterIP
  ports:
    - name: "3000"
      port: 3000
      targetPort: 3000
  selector:
    io.kompose.service: next-frontend

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: next-ingress-fanout
spec:
  ingressClassName: traefik
  rules:
   - host: app.localhost
     http:
      paths: 
        - path: /
          pathType: Prefix
          backend:
            service:
              name: next-frontend
              port:
                number: 3000
