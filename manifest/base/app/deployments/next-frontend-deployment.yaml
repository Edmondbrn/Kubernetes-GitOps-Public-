apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: next-frontend
  name: next-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: next-frontend
  template:
    metadata: 
      labels:
        io.kompose.service: next-frontend
    spec:
      serviceAccountName: mudis-sa
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000 
        seccompProfile:
          type: "RuntimeDefault"
      containers:
        - image: ghcr.io/edmondbrn/holograph-web/mudis_next_prod:1.0.0
          imagePullPolicy: Always # 1.0.0 is re-pushed in place
          name: nextjs-server
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: "256Mi"
              cpu: "1000m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          startupProbe:
            exec:
              command:
                - node
                - -e
                - 'require("http").get("http://localhost:3000/", r => process.exit(r.statusCode < 500 ? 0 : 1)).on("error", () => process.exit(1))'
            failureThreshold: 3
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - node
                - -e
                - 'require("http").get("http://localhost:3000/", r => process.exit(r.statusCode < 500 ? 0 : 1)).on("error", () => process.exit(1))'
            failureThreshold: 3
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - node
                - -e
                - 'require("http").get("http://localhost:3000/", r => process.exit(r.statusCode < 500 ? 0 : 1)).on("error", () => process.exit(1))'
            failureThreshold: 3
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 5
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: NEXT_TELEMETRY_DEBUG
              value: "1"
            # env variables from config
            - name: REFRESH_TOKEN_NAME
              valueFrom:
                configMapKeyRef:
                  name: mudis-config
                  key: REFRESH_TOKEN_NAME

            - name: ACCESS_TOKEN_NAME
              valueFrom:
                configMapKeyRef:
                  name: mudis-config
                  key: ACCESS_TOKEN_NAME
                  
            - name: NEXT_FAST_API_URL
              valueFrom:
                configMapKeyRef:
                  name: mudis-config
                  key: NEXT_FAST_API_URL