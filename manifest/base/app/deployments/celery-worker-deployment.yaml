apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose --file docker-compose.yml convert
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: celery-worker
  name: celery-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: celery-worker
  template:
    metadata:
      annotations:
        kompose.cmd: kompose --file docker-compose.yml convert
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: celery-worker
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # custom app user id see Dockerfile
        runAsGroup: 1000
        fsGroup: 1000 
        seccompProfile:
          type: "RuntimeDefault"
      initContainers:
        - name: wait-for-postgres
          image: postgres:18-alpine
          env:
          - name: PGUSER # overwrite default pg user because uid 1000 does not have any account
            valueFrom:
              configMapKeyRef:
                name: mudis-config
                key: DB_ADMIN_USER
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL..."
              until pg_isready -h postgres -p 5432; do
                sleep 2
              done
              echo "PostgreSQL is up"
        - name: wait-for-redis
          image: redis:8-alpine
          command:
            - sh
            - -c
            - |
              echo "Waiting for Redis..."
              until redis-cli -h redis -p 6379 ping | grep -q "PONG"; do
                sleep 2
              done
              echo "Redis is up"
        - name: wait-for-virtuoso
          image: busybox:1.38
          command:
            - sh
            - -c
            - |
              echo "Waiting for Virtuoso..."
              until wget -qO /dev/null http://virtuoso:8890/sparql; do
                sleep 2
              done
              echo "Virtuoso is up"
      containers:
        - image: ghcr.io/edmondbrn/mudis_fastapi_prod:1.0.0
          imagePullPolicy: Always # 1.0.0 is re-pushed in place
          name: celery-worker
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          # less than fastapi because Celery just send the query to Virtuoso
          resources:
            requests: # for scheduling step
              memory: "256Mi"
              cpu: "750m"
            limits: # for runtime step
              memory: "768Mi"
              cpu: "750m"
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  echo "Test Celery liveness..."
                  celery -A src.celery_app inspect ping -d celery@$HOSTNAME | grep -q OK || exit 1
            failureThreshold: 3
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  echo "Test Celery readiness..."
                  celery -A src.celery_app inspect ping -d celery@$HOSTNAME | grep -q OK || exit 1
            failureThreshold: 3
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
          args:
            - celery
            - -A
            - src.celery_app
            - worker
            - -Q
            - long_tasks
            - --concurrency=3
            - --prefetch-multiplier=1
            - --loglevel=info
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: "SERVICE_NAME" # overwrite service_name from env
              value: "celery"
          envFrom:
            - configMapRef:
                name: mudis-config
          volumeMounts:
            - mountPath: /run/secrets/DB_USER_PASSWORD
              name: db-user-password
              subPath: db-user-password
            - mountPath: /run/secrets/DB_PASSWORD_ADMIN
              name: db-password-admin
              subPath: db-password-admin
            - mountPath: /run/secrets/DB_PASSWORD_ANON
              name: db-password-anon
              subPath: db-password-anon
            - mountPath: /run/secrets/DB_PASSWORD_CRON
              name: db-password-cron
              subPath: db-password-cron
            - mountPath: /run/secrets/DBA_PASSWORD
              name: dba-password
              subPath: dba-password
            - mountPath: /run/secrets/JWT_SECRET_KEY
              name: jwt-secret-key
              subPath: jwt-secret-key
            - mountPath: /run/secrets/SEED_ADMIN_PASSWORD
              name: seed-admin-password
              subPath: seed-admin-password
            - mountPath: /run/secrets/DB_APP_ADMIN_PASSWORD
              name: db-app-admin-password
              subPath: db-app-admin-password
            # shared volumes between celery and fastapi server
            - mountPath: /celery/read
              name: celery-data
              readOnly: true
            - mountPath: /user-results/write
              name: user-results
            - mountPath: /var/log/app
              name: app-logs
      volumes:
        # shared volumes between celery and fastapi server
        - name: celery-data
          persistentVolumeClaim:
            claimName: celery-data
            readOnly: true
        - name: user-results
          persistentVolumeClaim:
            claimName: user-results
        - name: app-logs
          persistentVolumeClaim:
            claimName: app-logs
        # secrets mounting
        - name: db-user-password
          secret:
            items:
              - key: db-user-password
                path: db-user-password
            secretName: db-user-password
        - name: db-password-admin
          secret:
            items:
              - key: db-password-admin
                path: db-password-admin
            secretName: db-password-admin
        - name: db-password-anon
          secret:
            items:
              - key: db-password-anon
                path: db-password-anon
            secretName: db-password-anon
        - name: db-password-cron
          secret:
            items:
              - key: db-password-cron
                path: db-password-cron
            secretName: db-password-cron
        - name: dba-password
          secret:
            items:
              - key: dba-password
                path: dba-password
            secretName: dba-password
        - name: jwt-secret-key
          secret:
            items:
              - key: jwt-secret-key
                path: jwt-secret-key
            secretName: jwt-secret-key
        - name: seed-admin-password
          secret:
            items:
              - key: seed-admin-password
                path: seed-admin-password
            secretName: seed-admin-password
        - name: db-app-admin-password
          secret:
            items:
              - key: db-app-admin-password
                path: db-app-admin-password
            secretName: db-app-admin-password
