apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-monitoring-role
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-4" # after db-migrate, before the exporters roll out
  labels:
    app.kubernetes.io/name: postgres-monitoring-role
    io.kompose.service: postgres-monitoring-role
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-monitoring-role
        io.kompose.service: postgres-monitoring-role
    spec:
      serviceAccountName: mudis-sa
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres
          image: postgres:18-alpine
          env:
            - name: PGUSER # uid 1000 has no passwd entry in the postgres image
              valueFrom:
                configMapKeyRef:
                  name: mudis-config
                  key: DB_ADMIN_USER
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL..."
              until pg_isready -h postgres -p 5432; do
                sleep 2
              done
              echo "PostgreSQL is up"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: postgres-monitoring-role
          image: postgres:18-alpine
          command:
            - sh
            - -c
            - |
              set -eu
              exists="$(psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='monitoring'")"
              if [ "$exists" != "1" ]; then
                echo "Creating read-only monitoring role"
                psql -v ON_ERROR_STOP=1 -c "CREATE ROLE monitoring LOGIN PASSWORD '$MONITORING_PASSWORD'"
              else
                echo "Updating monitoring role password"
                psql -v ON_ERROR_STOP=1 -c "ALTER ROLE monitoring WITH LOGIN PASSWORD '$MONITORING_PASSWORD'"
              fi
              psql -v ON_ERROR_STOP=1 -c "GRANT pg_monitor TO monitoring"
              psql -tAc "SELECT rolname, rolcanlogin FROM pg_roles WHERE rolname='monitoring'"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          env:
            - name: PGHOST
              value: postgres
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: HolographSQL
            - name: PGUSER
              valueFrom:
                configMapKeyRef:
                  name: mudis-config
                  key: DB_ADMIN_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-password-admin
                  key: db-password-admin
            - name: MONITORING_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-monitoring
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
