apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: virtuoso-db
spec:
  selector:
    matchLabels:
      io.kompose.service: virtuoso
  serviceName: "virtuoso-headless"
  replicas: 1
  template:
    metadata:
      labels:
        io.kompose.service: virtuoso
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: "RuntimeDefault"

      initContainers:
      - name: init-permissions
        image: busybox:1.36
        command: ['sh', '-c', 'chown -R 1001:1001 /opt/virtuoso-opensource/database']
        volumeMounts:
        - name: virtuoso-db-vol
          mountPath: /opt/virtuoso-opensource/database
        securityContext:
          runAsNonRoot: false
          runAsUser: 0 # root to change permission

      containers:
        - image: mudis_virt_prod:1.0.0
          name: holographsql
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: 512Mi
              cpu: 1000m
            limits:
              memory: 1Gi
              cpu: 1000m
          command:
            - /bin/sh
            - -c
            - |
              export DBA_PASSWORD="$(cat /run/secrets/dba_password)"; export DAV_PASSWORD="$(cat /run/secrets/dav_password)"; exec /virtuoso-entrypoint.sh "$@"
            - --
          livenessProbe:
            exec:
              command: ["wget", "-q", "-O", "/dev/null", "http://localhost:8890/sparql"]
            failureThreshold: 10
            initialDelaySeconds: 180
            periodSeconds: 15
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command: ["wget", "-q", "-O", "/dev/null", "http://localhost:8890/sparql"]
            failureThreshold: 10
            initialDelaySeconds: 180
            periodSeconds: 15
            timeoutSeconds: 10
          ports:
            - containerPort: 8890
              name: virtuoso-db
              protocol: TCP
          env:
            - name: VIRT_PARAMETERS_DIRSALLOWED
              value: ., ../vad, /usr/share/proj, /data
            - name: VIRT_PARAMETERS_MAXDIRTYBUFFERS
              value: "6000"
            - name: VIRT_PARAMETERS_MAXTHREADS
              value: "100"
            - name: VIRT_PARAMETERS_NUMBEROFBUFFERS
              value: "10000"
          envFrom:
            - configMapRef:
                name: mudis-config
          volumeMounts:
            # mount the custom entrypoint file
            - mountPath: /initdb.d/load.sql
              readOnly: true
              name: virtuoso-cm2
              subPath: load.sql
            # database volume
            - mountPath: /opt/virtuoso-opensource/database
              name: virtuoso-db-vol
            # secrets
            - mountPath: /run/secrets/dba_password
              name: dba-password
              subPath: dba-password
            - mountPath: /run/secrets/dav_password
              name: dav-password
              subPath: dav-password
      volumes:
        # Secrets mounting
        - name: dba-password
          secret:
            items:
              - key: dba-password
                path: dba-password
            secretName: dba-password
        - name: dav-password
          secret:
            items:
              - key: dav-password
                path: dav-password
            secretName: dav-password
        # config map for the startup file
        - configMap:
            items:
              - key: load.sql
                path: load.sql
            name: virtuoso-cm2
          name: virtuoso-cm2
  volumeClaimTemplates:
  - metadata:
      name: virtuoso-db-vol
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "local-path"
      resources:
        requests:
          storage: 10Gi
