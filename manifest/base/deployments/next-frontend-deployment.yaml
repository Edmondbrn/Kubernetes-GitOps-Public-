apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose --file docker-compose.yml convert
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: next-frontend
  name: next-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: next-frontend
  template:
    metadata:
      annotations:
        kompose.cmd: kompose --file docker-compose.yml convert
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: next-frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000 
        seccompProfile:
          type: "RuntimeDefault"
      containers:
        - image: mudis_next_prod:1.0.0
          name: nextjs-server
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: "256Mi"
              cpu: "1000m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          # TODO init container waiting for backend replicas initialisation
          livenessProbe:
            exec:
              command:
                - node
                - -e
                - 'require("http").get("http://localhost:3000/", r => process.exit(r.statusCode < 500 ? 0 : 1)).on("error", () => process.exit(1))'
            failureThreshold: 3
            initialDelaySeconds: 45
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - node
                - -e
                - 'require("http").get("http://localhost:3000/", r => process.exit(r.statusCode < 500 ? 0 : 1)).on("error", () => process.exit(1))'
            failureThreshold: 3
            initialDelaySeconds: 45
            periodSeconds: 30
            timeoutSeconds: 5
          # Open port for Ingress controler
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: NEXT_TELEMETRY_DEBUG
              value: "1"
            # env variables from config
            - name: REFRESH_TOKEN_NAME
              valueFrom:
                configMapKeyRef:
                  name: mudis-config
                  key: REFRESH_TOKEN_NAME

            - name: ACCESS_TOKEN_NAME
              valueFrom:
                configMapKeyRef:
                  name: mudis-config
                  key: ACCESS_TOKEN_NAME
                  
            - name: NEXT_FAST_API_URL
              valueFrom:
                configMapKeyRef:
                  name: mudis-config
                  key: NEXT_FAST_API_URL