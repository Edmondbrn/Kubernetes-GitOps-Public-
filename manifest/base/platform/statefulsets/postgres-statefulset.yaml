apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-db
spec:
  selector:
    matchLabels:
      io.kompose.service: postgres
  serviceName: "postgres-headless"
  replicas: 1
  template:
    metadata:
      labels:
        io.kompose.service: postgres
    spec:
      serviceAccountName: mudis-sa
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 70  # postgres id on Alpine
        runAsGroup: 70
        fsGroup: 70 
        seccompProfile:
          type: "RuntimeDefault"

      initContainers:
      - name: init-permissions
        image: busybox:1.36
        command: ['sh', '-c', 'chown -R 70:70 /var/lib/postgresql']
        volumeMounts:
        - name: postgres-db-vol
          mountPath: /var/lib/postgresql
        securityContext:
          runAsNonRoot: false
          runAsUser: 0 # root to change permission

      
      containers:
        - image: ghcr.io/edmondbrn/holograph-web/mudis_postgres_prod:1.0.0
          name: holographsql
          # Bypass the image's /entrypoint-cron.sh: backups now run in the
          # postgres-backup CronJob
          command: ["/usr/local/bin/docker-entrypoint.sh"]
          args: ["postgres"]
          securityContext:  
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: 512Mi
              cpu: 1000m
            limits:
              memory: 1Gi
              cpu: 1000m
          startupProbe:
            exec:
              command: ["/bin/sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            failureThreshold: 5
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            failureThreshold: 5
            periodSeconds: 5
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            failureThreshold: 5
            periodSeconds: 5
            timeoutSeconds: 5
          ports:
            - containerPort: 5432
              name: postgres-db
              protocol: TCP
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: mudis-config
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: mudis-config
                  key: DB_ADMIN_USER
            - name: POSTGRES_PASSWORD_FILE
              value: /run/secrets/db-password-admin

          volumeMounts:
            - mountPath: /run/secrets/db-password-admin
              name: db-password-admin
              subPath: db-password-admin
            - mountPath: /var/lib/postgresql
              name: postgres-db-vol
      volumes:
        - name: db-password-admin
          secret:
            items:
              - key: db-password-admin
                path: db-password-admin
            secretName: db-password-admin
  volumeClaimTemplates:
  - metadata:
      name: postgres-db-vol
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "local-path"
      resources:
        requests:
          storage: 10Gi
