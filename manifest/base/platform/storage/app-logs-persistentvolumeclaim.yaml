apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    io.kompose.service: app-logs
  name: app-logs
spec:
  accessModes:
    - ReadWriteMany # cannot guarantee that all the backend replicas are in the same node
  storageClassName: nfs-csi
  resources:
    requests:
      storage: 100Mi
