apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - config/mudis-config.yaml
  - config/virtuoso-cm2-configmap.yaml
  - config/network-policy.yaml
  - config/serviceaccount.yaml
  - cronjobs/postgres-backup-cronjob.yaml
  - deployments/nfs-server-deployment.yaml
  - deployments/redis-deployment.yaml
  - secrets
  - services/nfs-server-service.yaml
  - services/postgres-service.yaml
  - services/redis-service.yaml
  - services/virtuoso-service.yaml
  - statefulsets/postgres-statefulset.yaml
  - statefulsets/virtuoso-statefulset.yaml
  - storage/app-logs-persistentvolumeclaim.yaml
  - storage/celery-data-persistentvolumeclaim.yaml
  - storage/nfs-storage.yaml
  - storage/postgres-backups-persistentvolumeclaim.yaml
  - storage/user-results-persistentvolumeclaim.yaml
patches:
  - target:
      kind: StorageClass
    # Argocd must create Storageclass at the beginning just after the namespace creation
    patch: |-
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-wave
        value: "-9"
