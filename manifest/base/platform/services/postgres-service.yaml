
# for apps connected to postgres
apiVersion: v1
kind: Service
metadata:
  labels:
    io.kompose.service: postgres
  name: postgres
spec:
  type: ClusterIP
  ports:
    - name: "5432"
      port: 5432
      targetPort: 5432
  selector:
    io.kompose.service: postgres


---
# for postgres statefulsets
apiVersion: v1
kind: Service
metadata:
  labels:
    io.kompose.service: postgres-headless
  name: postgres-headless
spec:
  clusterIP: None
  selector:
    io.kompose.service: postgres