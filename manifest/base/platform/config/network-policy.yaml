apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---

# Aloow DNS resolution for pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---

# databases allow request from fastapi
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-to-databases
spec:
  podSelector:
      matchExpressions:
        - key: io.kompose.service
          operator: In
          values:
            - redis
            - postgres
            - virtuoso  
  policyTypes:
    - Ingress

  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: io.kompose.service
                operator: In
                values:
                  - fastapi-backend
                  - celery-worker
      ports:
        - protocol: TCP
          port: 6379  # Redis
        - protocol: TCP
          port: 5432  # Postgres
        - protocol: TCP
          port: 8890  # Virtuoso (HTTP)

---

# allow FastAPI to perform request to databases
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-egress
spec:
  podSelector:
    matchExpressions:
      - key: io.kompose.service
        operator: In
        values:
          - fastapi-backend
          - celery-worker
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchExpressions:
              - key: io.kompose.service
                operator: In
                values:
                  - redis
                  - postgres
                  - virtuoso
      ports:
        - protocol: TCP
          port: 6379  # Redis
        - protocol: TCP
          port: 5432  # Postgres
        - protocol: TCP
          port: 8890  # Virtuoso (HTTP)

---

# Allow the database jobs (postgres-backup CronJob and db-migrate PreSync Job) to reach postgres
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-db-jobs-to-postgres
spec:
  podSelector:
    matchLabels:
      io.kompose.service: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: io.kompose.service
                operator: In
                values:
                  - postgres-backup
                  - db-migrate
                  - celery-data-creation
                  - clear-refresh-tokens
                  - clear-user-results
      ports:
        - protocol: TCP
          port: 5432

---

# Allow the database jobs (postgres-backup CronJob and db-migrate PreSync Job)
# to reach postgres (egress is denied by default)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-db-jobs-egress
spec:
  podSelector:
    matchExpressions:
      - key: io.kompose.service
        operator: In
        values:
          - postgres-backup
          - db-migrate
          - celery-data-creation
          - clear-refresh-tokens
          - clear-user-results
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              io.kompose.service: postgres
      ports:
        - protocol: TCP
          port: 5432

---

# FastAPI accept request from Next
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-backend
spec:
  podSelector:
    matchLabels:
      io.kompose.service: fastapi-backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              io.kompose.service: next-frontend
      ports:
        - protocol: TCP
          port: 8000

---

# Allow Nextjs to perform request to FastAPI
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-egress
spec:
  podSelector:
    matchLabels:
      io.kompose.service: next-frontend
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              io.kompose.service: fastapi-backend
      ports:
        - protocol: TCP
          port: 8000

---

# Allow Treafik to forward request to NextJs
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-frontend
spec:
  podSelector:
    matchLabels:
      io.kompose.service: next-frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 3000

---

# Prometheus (monitoring namespace) scrapes the exporters
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-scrape-exporters
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: monitoring
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9187  # postgres-exporter
        - protocol: TCP
          port: 9121  # redis-exporter

---

# blackbox-exporter probes FastAPI /health and Virtuoso /sparql
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-probes
spec:
  podSelector:
    matchExpressions:
      - key: io.kompose.service
        operator: In
        values:
          - fastapi-backend
          - virtuoso
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 8890

---

# exporters need to reach the datastores they monitor
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-exporters-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: monitoring
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              io.kompose.service: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              io.kompose.service: redis
      ports:
        - protocol: TCP
          port: 6379
