apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: mudis-alerts
  labels:
    app.kubernetes.io/component: monitoring
spec:
  groups:
    - name: mudis-datastores
      rules:
        - alert: PostgresExporterDown
          expr: up{job="postgres-exporter"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Postgres exporter is down or cannot scrape Postgres"
            description: "The postgres-exporter target has been down for 5 minutes."

        - alert: RedisExporterDown
          expr: up{job="redis-exporter"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Redis exporter is down or cannot scrape Redis"
            description: "The redis-exporter target has been down for 5 minutes."

        - alert: PostgresTooManyConnections
          expr: sum(pg_stat_activity_count) by (instance) > 80
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Postgres has many active connections"
            description: "More than 80 connections are open on {{ $labels.instance }}."

    - name: mudis-availability
      rules:
        - alert: FastAPIProbeFailing
          expr: probe_success{job="fastapi-health"} == 0
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: "FastAPI /health is not reachable"
            description: "Blackbox probe to FastAPI has been failing for 3 minutes."

        - alert: VirtuosoProbeFailing
          expr: probe_success{job="virtuoso-sparql"} == 0
          for: 3m
          labels:
            severity: warning
          annotations:
            summary: "Virtuoso SPARQL endpoint is not reachable"
            description: "Blackbox probe to Virtuoso /sparql has been failing for 3 minutes."

    - name: mudis-storage
      rules:
        - alert: PersistentVolumeFillingUp
          expr: |
            kubelet_volume_stats_available_bytes
              / kubelet_volume_stats_capacity_bytes < 0.15
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "PVC {{ $labels.persistentvolumeclaim }} is almost full"
            description: "Less than 15% of the volume is available."
