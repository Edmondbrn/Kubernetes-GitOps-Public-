name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  APP_VERSION: "1.0.0"

jobs:
  # ============================================================
  # Backend tests (FastAPI)
  # ============================================================
  backend_test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_DB: test_postgres_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: postgres
      DB_PASSWORD_CRON: cron_pwd
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/test_postgres_db
      WEB_VIRTUOSO_URL: http://localhost:8891/sparql-auth
      DOCKER_VIRTUOSO_URL: http://localhost:8891/sparql-auth
      DBA_PASSWORD: testPwd
      DAV_PASSWORD: testPwd
      # Test-only values, not sensitive
      JWT_SECRET_KEY: h0J4fppGM5oJWMb+t7Wsiuq8KJ7RZvB05irDQ1WEwuY=
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_NAME: access_token
      REFRESH_TOKEN_NAME: refresh_token
      DB_USER: test_db_user
      DB_APP_ADMIN_USER: app_admin
      DB_PASSWORD_ANON: h0J4fppGM5oJWMb+t7Wsiuq8KJ7RZvB05irDQ1WEwuY=
      DB_USER_PASSWORD: h0J4fppGM5oJWMb+t7Wsiuq8KJ7RZvB05irDQ1WEwuY=
      DB_APP_ADMIN_PASSWORD: h0J4fppGM5oJWMb+t7Wsiuq8KJ7RZvB05irDQ1WEwuY=
      DB_HOST: localhost
      DB_PORT: 5433
      DB_NAME: test_postgres_db
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      ENVIRONMENT: dev
      SEED_ADMIN_EMAIL: admin@inrae.fr
      SEED_ADMIN_USERNAME: admin
      SEED_ADMIN_PASSWORD: test_password_admin
      VIRTUOSO_POOL_ENABLED: false
      VIRTUOSO_LONG_MAX: 3
      VIRTUOSO_SHORT_MAX: 10
      VIRTUOSO_REDIS_URL: redis://localhost:6379/15
      VIRTUOSO_ACQUIRE_TIMEOUT: 30
      SERVICE_NAME: api
      LOG_DIR: /tmp/app-logs
      RATE_LIMITER_REDIS_URL: redis://localhost:6379/14
      CELERY_BROKER_URL: redis://localhost:6379/12
      CELERY_RESULT_BACKEND: redis://localhost:6379/13
      TRUST_PROXY_HEADERS: false
      TRUSTED_PROXY_CIDRS: ""
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: fastapi_backend/uv.lock

      - name: Start test services
        run: |
          docker compose -f docker-compose.test.yml down -v --remove-orphans || true
          docker compose -f docker-compose.test.yml up -d

      - name: Wait for services
        timeout-minutes: 5
        run: |
          until docker compose -f docker-compose.test.yml exec -T postgres_test \
            pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do sleep 2; done
          until [ "$(curl -s -o /dev/null -w '%{http_code}' --connect-timeout 5 http://localhost:8891/sparql)" = "200" ]; do sleep 2; done
          until docker compose -f docker-compose.test.yml exec -T redis redis-cli ping | grep -q PONG; do sleep 2; done
          echo "Virtuoso, Redis and Postgres are ready."

      - name: Install dependencies
        working-directory: fastapi_backend
        run: uv sync --frozen --no-install-project

      - name: Run migrations
        working-directory: fastapi_backend
        run: uv run --frozen alembic upgrade head

      - name: Run tests
        working-directory: fastapi_backend
        run: uv run --frozen pytest

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            fastapi_backend/lcov.info
            fastapi_backend/coverage.xml
          if-no-files-found: warn
          retention-days: 30

      - name: Stop test services
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  # ============================================================
  # Frontend checks (Next.js)
  # ============================================================
  frontend_lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-frontend
      - name: Lint
        working-directory: next_frontend
        run: pnpm run lint

  frontend_typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-frontend
      - name: Type check
        working-directory: next_frontend
        run: pnpm run type-check

  frontend_test:
    needs: [frontend_lint, frontend_typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ACCESS_TOKEN_NAME: access_token
      REFRESH_TOKEN_NAME: refresh_token
      FAST_API_URL: http://fastapi_backend:8000
      NEXT_PUBLIC_API_URL: http://localhost:3000/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-frontend
      - name: Jest tests
        working-directory: next_frontend
        run: pnpm test
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: next_frontend/coverage
          if-no-files-found: warn
          retention-days: 30

  # ============================================================
  # Docker images: mudis_<service>_prod:<version> and :<short sha>
  # Pushed to GHCR only on main
  # ============================================================
  docker_build:
    needs: [backend_test, frontend_test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: fastapi, context: fastapi_backend, build_args: "" }
          - { name: postgres, context: postgres, build_args: "" }
          - { name: next, context: next_frontend, build_args: "NEXT_PUBLIC_API_URL=/api/v1" }
          - { name: virt, context: virtuoso, build_args: "" }
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name and short SHA
        id: vars
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/mudis_${{ matrix.name }}_prod" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          build-args: ${{ matrix.build_args }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.vars.outputs.image }}:${{ env.APP_VERSION }}
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}