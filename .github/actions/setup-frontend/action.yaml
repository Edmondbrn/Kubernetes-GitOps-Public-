name: Setup frontend
description: Install pnpm, Node.js and the dependencies of next_frontend (with pnpm store cache)

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        package_json_file: next_frontend/package.json

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: next_frontend/pnpm-lock.yaml

    # build handled by pnpm-workspace file
    - name: Install dependencies
      shell: bash
      working-directory: next_frontend
      run: pnpm install --frozen-lockfile